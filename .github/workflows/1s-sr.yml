name: Python Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: python-builder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source

      - name: Debug Repository Files
        run: |
          echo "========== PUBLIC REPOSITORY =========="
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Python files:"
          find . -path "./private-source" -prune -o -type f -name "*.py" -print

          echo "========== PRIVATE REPOSITORY =========="
          echo "Files:"
          ls -la private-source
          echo "Python files:"
          find private-source -type f -name "*.py" -print

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome

      - name: Run Python
        run: |
          python sk-file.py --encode

      - name: Check Output
        run: |
          ls -lh output_encoded.txt
          test -s output_encoded.txt

      - name: Copy Output File
        run: |
          cp output_encoded.txt private-source/output_encoded.txt

      - name: Push Output
        working-directory: private-source
        run: |
          test -s output_encoded.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output_encoded.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          else
            echo "No changes to push."
          fi
