name: Python Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: python-builder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Public Repository
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # 2. Checkout Private Repository
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: /tmp/private-repo

      # 3. Debug Repository Files
      - name: Debug Repository Files
        run: |
          echo "========== PUBLIC REPOSITORY =========="
          pwd
          ls -lah

          echo "========== PRIVATE REPOSITORY ROOT =========="
          ls -lah /tmp/private-repo

          echo "========== PRIVATE PYTHON FILES =========="
          find /tmp/private-repo -maxdepth 1 -type f -name "*.py"

          echo "========== TARGET SCRIPT =========="
          test -f /tmp/private-repo/sk-file.py
          echo "sk-file.py found!"

      # 4. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 5. Python Version
      - name: Python Version
        run: |
          python --version
          pip --version

      # 6. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome
          pip list

      # 7. Verify Script
      - name: Verify Python Script
        run: |
          if [ ! -f "/tmp/private-repo/sk-file.py" ]; then
            echo "ERROR: sk-file.py not found!"
            exit 1
          fi

          echo "Python script verified."

      # 8. Run Python
      - name: Run Python
        working-directory: /tmp/private-repo
        run: |
          python -u sk-file.py --encode

      # 9. Check Output
      - name: Check Output
        run: |
          if [ ! -s "/tmp/private-repo/output_encoded.txt" ]; then
            echo "ERROR: output_encoded.txt missing or empty!"
            find /tmp/private-repo -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Output generated successfully."
          ls -lh /tmp/private-repo/output_encoded.txt

      # 10. Copy Output
      - name: Copy Output File
        run: |
          cp /tmp/private-repo/output_encoded.txt output_encoded.txt
          test -s output_encoded.txt

      # 11. Git Debug
      - name: Git Debug
        run: |
          echo "========== GIT STATUS =========="
          git status
          git diff --stat

      # 12. Push Output
      - name: Push Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output_encoded.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
            echo "SUCCESS: Output pushed."
          else
            echo "No changes to push."
          fi

      # 13. Final Status
      - name: Final Status
        if: always()
        run: |
          echo "========== WORKFLOW FINISHED =========="
          echo "Job status: ${{ job.status }}"
