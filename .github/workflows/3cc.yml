
name: PHP Builder

run-name: Queue ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Queue ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: global-workflow-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Main repository
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      # Private repository
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      # PHP setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # List files before PHP execution
      - name: List Files Before Run
        working-directory: private-repo
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo ""
          echo "========== FILES AND FOLDERS =========="
          ls -lah

          echo ""
          echo "========== RECURSIVE FILE LIST =========="
          find . -type f -printf '%p (%s bytes)\n' | sort

      # Validate PHP
      - name: Validate PHP
        working-directory: private-repo
        run: |
          php -l crf.php

      # Run PHP Builder
      - name: Run PHP Builder
        working-directory: private-repo
        run: |
          echo "========== RUNNING PHP =========="

          php crf.php

          echo ""
          echo "========== FILES AFTER PHP RUN =========="
          pwd
          ls -lah

          echo ""
          echo "========== RECURSIVE FILE LIST =========="
          find . -type f -printf '%p (%s bytes)\n' | sort

          echo ""
          echo "========== ALL.TXT CHECK =========="

          if [ -f all.txt ]; then
            echo "SUCCESS: all.txt found"
            wc -c all.txt
            ls -lh all.txt
          else
            echo "ERROR: all.txt NOT FOUND"
            exit 1
          fi

      # Copy generated output
      - name: Copy Output
        run: |
          echo "========== COPY OUTPUT =========="

          if [ ! -s private-repo/all.txt ]; then
            echo "ERROR: private-repo/all.txt missing or empty"
            exit 1
          fi

          cp private-repo/all.txt output.txt

          echo "Output copied successfully"
          ls -lh output.txt

      # Remove private repository
      - name: Remove Private Repo
        run: |
          rm -rf private-repo
          echo "Private repository removed"

      # PHP Encoder from GitHub Secret
      - name: Encode Output
        env:
          ENCODE: "true"
          INPUT_FILE: ${{ github.workspace }}/output.txt
          OUTPUT_DIR: ${{ github.workspace }}/output
          PHP_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          php -r 'eval("?>" . getenv("PHP_SCRIPT"));'

      # Verify encoded output
      - name: Verify Encoded Output
        run: |
          echo "========== ENCODED FILES =========="

          if [ ! -d output3 ]; then
            echo "ERROR: output3 directory not found"
            exit 1
          fi

          find output3 -type f -printf '%p (%s bytes)\n' | sort

      # Push Only Encoded Output
      - name: Push Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output3/

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          else
            echo "No changes to push"
          fi

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f output.txt output3.txt
          echo "Cleanup completed"
