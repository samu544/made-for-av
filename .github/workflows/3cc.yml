
name: PHP Builder

run-name: Queue ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Queue ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: global-workflow-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, openssl
          coverage: none

      - name: Validate PHP
        working-directory: private-repo
        run: |
          php -v
          php -m | grep -Ei 'curl|openssl'
          php -l crf.php

      - name: Run PHP Builder
        working-directory: private-repo
        shell: bash
        run: |
          set +e

          php \
            -d display_errors=1 \
            -d log_errors=1 \
            -d error_log=php-error.log \
            crf.php

          PHP_EXIT=$?

          set -e

          echo "========== PHP EXIT =========="
          echo "$PHP_EXIT"

          echo "========== FILES =========="
          ls -lah

          echo "========== DEBUG LOG =========="
          if [ -f php-debug.log ]; then
            cat php-debug.log
          fi

          echo "========== PHP ERROR =========="
          if [ -f php-error.log ]; then
            cat php-error.log
          fi

          echo "========== ALL.TXT =========="
          if [ ! -s all.txt ]; then
            echo "ERROR: all.txt missing or empty"
            exit 1
          fi

          cat all.txt

          if [ "$PHP_EXIT" -ne 0 ]; then
            echo "ERROR: PHP execution failed"
            exit 1
          fi

          if ! jq -e '.success == true' all.txt >/dev/null; then
            echo "ERROR: PHP output success=false"
            exit 1
          fi

      - name: Prepare Encoder Input
        run: |
          cp private-repo/all.txt all.txt
          cp private-repo/all.txt output.txt

          echo "========== ENCODER INPUT =========="
          ls -lh all.txt output.txt

      - name: Encode Output
        env:
          ENCODE: "true"
          INPUT_FILE: ${{ github.workspace }}/all.txt
          OUTPUT_DIR: ${{ github.workspace }}/output
          PHP_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          php -r 'eval("?>" . getenv("PHP_SCRIPT"));'

      - name: Verify Encoded Output
        run: |
          echo "========== GENERATED FILES =========="

          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -printf '%p (%s bytes)\n'

          if [ ! -d output3 ]; then
            echo "ERROR: output3 directory not found"
            exit 1
          fi

          if [ -z "$(find output3 -type f -print -quit)" ]; then
            echo "ERROR: output3 directory is empty"
            exit 1
          fi

      - name: Push Encoded Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output3/

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          else
            echo "No changes to push"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f all.txt output.txt
          rm -f private-repo/all.txt
          rm -f private-repo/all.txt.tmp
          rm -f private-repo/php-debug.log
          rm -f private-repo/php-error.log
