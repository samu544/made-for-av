
name: PHP Builder

run-name: Queue ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Queue ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: global-workflow-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Run PHP Builder
        working-directory: private-repo
        run: |
          echo "Starting PHP Builder..."

          php -l crf.php

          php crf.php

          echo "Checking generated output..."

          if [ ! -f all.txt ]; then
            echo "::error::PHP did not generate all.txt"
            echo "Directory contents:"
            ls -la
            exit 1
          fi

          if [ ! -s all.txt ]; then
            echo "::error::all.txt is empty"
            exit 1
          fi

          echo "PHP Builder completed successfully."
          ls -lh all.txt

      - name: Copy Output
        run: |
          cp private-repo/all.txt output.txt
          test -s output.txt

      - name: Remove Private Repository
        run: rm -rf private-repo

      - name: Encode Output
        env:
          ENCODE: "true"
          INPUT_FILE: ${{ github.workspace }}/output.txt
          OUTPUT_DIR: ${{ github.workspace }}/output
          PHP_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          php -r 'eval("?>" . getenv("PHP_SCRIPT"));'

      - name: Verify Encoded Output
        run: |
          if [ ! -d output3 ]; then
            echo "::error::output3 directory not found"
            ls -la
            exit 1
          fi

          ls -lah output3/

      - name: Push Only Encoded Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output3/

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          else
            echo "No changes to push"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f output.txt output3.txt
          rm -rf private-repo
