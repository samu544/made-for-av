
name: PHP Builder

run-name: Queue ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Queue ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: global-workflow-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Main repository
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      # Private repository
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      # PHP setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # Run PHP Builder
      - name: Run PHP Builder
        working-directory: private-repo
        run: |
          echo "========== BEFORE PHP =========="
          pwd
          ls -lah

          echo ""
          echo "========== PHP SYNTAX =========="
          php -l crf.php

          echo ""
          echo "========== RUN PHP =========="
          php crf.php

          echo ""
          echo "========== AFTER PHP =========="
          ls -lah

          echo ""
          echo "========== ALL FILES =========="
          find . -type f -not -path './.git/*' -printf '%p (%s bytes)\n' | sort

          echo ""
          echo "========== CHECK all.txt =========="

          if [ ! -s all.txt ]; then
            echo "ERROR: all.txt missing or empty"
            exit 1
          fi

          echo "SUCCESS: all.txt generated"
          wc -c all.txt

      # Copy PHP output to Main Repository
      - name: Prepare Encoder Input
        run: |
          echo "========== PREPARE OUTPUT =========="

          SOURCE="private-repo/all.txt"

          if [ ! -s "$SOURCE" ]; then
            echo "ERROR: private-repo/all.txt missing or empty"
            exit 1
          fi

          # Main input files
          cp "$SOURCE" all.txt
          cp "$SOURCE" output.txt
          cp "$SOURCE" output3.txt

          echo ""
          echo "========== GENERATED FILES =========="
          ls -lh all.txt output.txt output3.txt

      # Remove private repository
      - name: Remove Private Repo
        run: |
          rm -rf private-repo
          echo "Private repository removed"

      # PHP Encoder from GitHub Secret
      - name: Encode Output
        env:
          ENCODE: "true"
          INPUT_FILE: ${{ github.workspace }}/output.txt
          OUTPUT_DIR: ${{ github.workspace }}/output
          PHP_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          php -r 'eval("?>" . getenv("PHP_SCRIPT"));'

          echo ""
          echo "========== ENCODER RESULT =========="
          ls -lah

      # Verify encoded output
      - name: Verify Encoded Output
        run: |
          echo "========== OUTPUT3 DIRECTORY =========="

          if [ ! -d output3 ]; then
            echo "ERROR: output3 directory not found"
            exit 1
          fi

          find output3 -type f -printf '%p (%s bytes)\n' | sort

      # Push Only Encoded Output
      - name: Push Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output3/

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          else
            echo "No changes to push"
          fi

      # Cleanup temporary files
      - name: Cleanup
        if: always()
        run: |
          rm -f all.txt output.txt output3.txt
          echo "Cleanup completed"
