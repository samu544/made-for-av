name: PHP Builder

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-workflow-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, openssl
          coverage: none

      - name: Validate PHP
        working-directory: private-repo
        run: php -l crf.php

      - name: Run PHP Builder
        working-directory: private-repo
        run: |
          php -d display_errors=0 crf.php

          if [ ! -s all.txt ]; then
            echo "PHP Builder failed"
            exit 1
          fi

          if ! jq -e '.success == true' all.txt >/dev/null; then
            echo "PHP Builder returned an unsuccessful result"
            exit 1
          fi

      - name: Prepare Encoder Input
        run: |
          cp private-repo/all.txt all.txt
          cp private-repo/all.txt output.txt

      - name: Encode Output
        env:
          ENCODE: "true"
          INPUT_FILE: ${{ github.workspace }}/all.txt
          OUTPUT_DIR: ${{ github.workspace }}/output3
          PHP_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          php -r 'eval("?>" . getenv("PHP_SCRIPT"));'

      - name: Verify Encoded Output
        run: |
          if [ ! -d output3 ]; then
            echo "Encoded output missing"
            exit 1
          fi

          if [ -z "$(find output3 -type f -print -quit)" ]; then
            echo "Encoded output is empty"
            exit 1
          fi

      - name: Push Encoded Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output3/

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f all.txt output.txt
          rm -f private-repo/all.txt
          rm -f private-repo/all.txt.tmp
          rm -f private-repo/php-debug.log
          rm -f private-repo/php-error.log
          rm -f private-repo/php-error.log.
