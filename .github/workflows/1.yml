
name: PHP Builder

run-name: Queue ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Queue ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: global-workflow-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Main repository
      - uses: actions/checkout@v4

      # Private repository
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      # PHP setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # Run PHP builder
      - name: Run PHP Builder
        working-directory: private-repo
        run: php sp-x.php > /dev/null 2>&1  # Copy generated output
      - name: Copy Output
        run: cp private-repo/all.txt output.txt

      # Remove private repository
      - name: Remove Private Repo
        run: rm -rf private-repo

      # PHP Encoder from GitHub Secret
      - name: Encode Output
        env:
          ENCODE: "true"
          INPUT_FILE: ${{ github.workspace }}/output.txt
          OUTPUT_DIR: ${{ github.workspace }}/output
          PHP_SCRIPT: ${{ secrets.x7Kp9mQ44 }}
        run: |
          php -r 'eval("?>" . getenv("PHP_SCRIPT"));'

      # Push output
      - name: Push Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.txt output/

          if ! git diff --cached --quiet; then
            git commit -m "Update encoded output [skip ci]"
            git push
          else
            echo "No changes to push"
          fi
